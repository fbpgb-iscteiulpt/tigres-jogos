<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tigres — Análise de Jogos</title>
<!-- Ícone da app (ecrã principal do iPhone / Android) -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Tigres">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1b2f6b">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand">
    <img class="crest" src="logos/tigres.png" alt="Tigres">

    <div>
      <h1>Tigres</h1>
      <p class="sub" id="brandSub">Análise de Jogos</p>
    </div>
  </div>
  <nav class="tabs" id="nav">
    <div class="nav-head">
      <img class="crest" src="logos/tigres.png" alt="Tigres">
      <span>Tigres</span>
      <button class="nav-close" id="navClose" aria-label="Fechar menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <button data-view="epoca" class="tab active">Época</button>
    <button data-view="jornadas" class="tab">Jornadas</button>
    <button data-view="classificacao" class="tab">Classificação</button>
    <button data-view="jogadores" class="tab">Jogadores</button>
    <button data-view="comparar" class="tab">Comparar jogadores</button>
    <button data-view="equipa" class="tab">Estatísticas da equipa</button>
    <button data-view="dicas" class="tab">Dicas de treino</button>
    <button data-view="lesoes" class="tab">Lesões e disciplina</button>
    <button data-view="posse" class="tab">Cálculo de posse de bola</button>
  </nav>
  <div class="status" id="syncStatus" title="Estado dos dados"></div>
</header>
<div class="nav-backdrop" id="navBackdrop" hidden></div>

<main id="app">
  <div class="skel" id="loading" aria-label="A carregar dados" role="status">
    <div class="sk sk-title"></div>
    <div class="sk sk-card"></div>
    <div class="sk-row"><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div></div>
    <div class="sk sk-title"></div>
    <div class="sk sk-card short"></div>
    <div class="sk sk-card short"></div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div id="modalBody"></div>
  </div>
</div>

<footer class="footer">
  <span id="footerInfo"></span>
</footer>

<script src="ratings.js"></script>
<script src="xg.js"></script>
<script src="app.js"></script>
</body>
</html>
