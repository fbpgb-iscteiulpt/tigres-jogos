<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tigres — Análise de Jogos</title>
<!-- Ícone da app (ecrã principal do iPhone / Android) -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Tigres">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1b2f6b">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand">
    <img class="crest" src="logos/tigres.png" alt="Tigres">

    <div>
      <h1>Tigres</h1>
      <p class="sub" id="brandSub">Análise de Jogos</p>
    </div>
  </div>
  <nav class="tabs" id="nav">
    <div class="nav-head">
      <img class="crest" src="logos/tigres.png" alt="Tigres">
      <span>Tigres</span>
      <button class="nav-close" id="navClose" aria-label="Fechar menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <button data-group="epoca" class="tab active">Época</button>
    <button data-group="jogos" class="tab">Jogos</button>
    <button data-group="plantel" class="tab">Jogadores</button>
    <button data-group="equipa" class="tab">Equipa</button>
    <button data-group="lesoes" class="tab">Lesões e disciplina</button>
    <details class="tools" id="tools">
      <summary class="tools-btn" aria-label="Ferramentas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><span>Ferramentas</span><i class="tools-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></i></summary>
      <div class="tools-menu">
        <button type="button" class="tool" data-tool="posse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Cálculo de posse de bola</span></button>
        <button type="button" class="tool" data-tool="definicoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Definições</span></button>
      </div>
    </details>
  </nav>
  <div class="status" id="syncStatus" title="Estado dos dados"></div>
</header>
<div class="nav-backdrop" id="navBackdrop" hidden></div>

<main id="app">
  <div class="skel" id="loading" aria-label="A carregar dados" role="status">
    <div class="sk sk-title"></div>
    <div class="sk sk-card"></div>
    <div class="sk-row"><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div></div>
    <div class="sk sk-title"></div>
    <div class="sk sk-card short"></div>
    <div class="sk sk-card short"></div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div id="modalBody"></div>
  </div>
</div>

<footer class="footer">
  <span id="footerInfo"></span>
</footer>

<script src="ratings.js"></script>
<script src="xg.js"></script>
<script src="app.js"></script>
</body>
</html>
