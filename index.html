<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tigres — Análise de Jogos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
  <div class="brand">
    <img class="crest" src="logos/tigres.png" alt="Tigres">

    <div>
      <h1>Tigres</h1>
      <p class="sub">Análise de Jogos</p>
    </div>
  </div>
  <nav class="tabs" id="nav">
    <div class="nav-head">
      <img class="crest" src="logos/tigres.png" alt="Tigres">
      <span>Tigres</span>
      <button class="nav-close" id="navClose" aria-label="Fechar menu">✕</button>
    </div>
    <button data-view="epoca" class="tab active">Época</button>
    <button data-view="jornadas" class="tab">Jornadas</button>
    <button data-view="jogadores" class="tab">Jogadores</button>
    <button data-view="nova" class="tab">Nova Jornada</button>
  </nav>
  <div class="status" id="syncStatus" title="Estado dos dados"></div>
</header>
<div class="nav-backdrop" id="navBackdrop" hidden></div>

<main id="app">
  <div class="loading" id="loading">A carregar dados…</div>
</main>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<footer class="footer">
  <span id="footerInfo"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
