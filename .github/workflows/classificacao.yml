name: Atualizar classificação

on:
  schedule:
    - cron: "0 */6 * * *"   # de 6 em 6 horas
  workflow_dispatch:         # botão "Run workflow" para correr à mão

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-classificacao.mjs
      - name: Commit se mudou
        run: |
          if git diff --quiet data.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Atualizar classificação (CIF)"
          git push
